services:
  - type: web
    name: fixurdevice-backend
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    plan: free
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*,localhost,127.0.0.1,.onrender.com,.vercel.app,.fixurdevice.in,fixurdevice.in"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://fixurdevice.in,https://www.fixurdevice.in,https://fixurdevice.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.vercel.app,https://*.onrender.com,https://fixurdevice.in,https://www.fixurdevice.in"
